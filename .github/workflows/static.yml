name: Static checks

on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    env:
      REQUIRE_NODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: pip install -r requirements-testing.txt
      - name: Script syntax
        run: git ls-files -z 'behavior_packs/*.js' 'testing/scenarios/*.js' | xargs -0 -n1 node --check
      - name: Script API types
        run: npm run typecheck
      - name: Unit and contract tests
        run: python -m pytest -q
      - name: Validate
        run: python scripts/validate_project.py
      - name: Package
        run: python scripts/package_addon.py
